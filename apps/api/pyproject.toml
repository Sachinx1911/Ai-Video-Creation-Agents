[project]
name = "studio"
version = "0.1.0"
description = "AI Video Creation Studio - API and workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143",  # HTTP API + uvicorn server
    "sqlalchemy>=2.1",           # ORM / SQL toolkit
    "alembic>=1.20",             # versioned migrations
    "psycopg[binary]>=3.3",      # PostgreSQL driver
    "pydantic>=2.14",            # schemas / validation
    "pydantic-settings>=2.15",   # env-based configuration
    "python-multipart>=0.0.32",  # multipart uploads
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx>=0.28", "pgserver>=0.1.4"]  # pgserver: Postgres without Docker (scripts/dev_db.py)

[project.scripts]
studio-worker = "studio.workers.runner:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: requires PostgreSQL (TEST_DATABASE_URL)",
    "media: requires ffmpeg/ffprobe on PATH",
]
